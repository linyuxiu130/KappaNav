[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kappanav"
version = "1.0.0"
description = "KappaNav: air-ground collaborative navigation (overhead traversability, global route, CurveNav local planner)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6,<2.8",
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "numba>=0.59",
]


[project.optional-dependencies]
test = ["pytest>=8.0"]
global = ["transformers>=4.57,<4.58", "Pillow", "opencv-python-headless"]
geotiff = ["rasterio"]

[tool.setuptools.packages.find]
include = ["kappanav*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests", "tests/common", "tests/global_planner", "tests/local_planner", "tests/evaluation"]
addopts = "-ra"
